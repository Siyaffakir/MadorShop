version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: dz_shop_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: dz_shop
      MYSQL_USER: dz_user
      MYSQL_PASSWORD: dz_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
